openapi: 3.0.3
info:
  title: Russian exam prep API
  version: 0.1.0
  description: Practice exams for the Russian language, history and law test (RVP, residence permit, citizenship).
servers:
  - url: /api

components:
  securitySchemes:
    bearer:
      type: http
      scheme: bearer
      bearerFormat: JWT

  responses:
    Error:
      description: Error
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }

  parameters:
    ExamID:
      name: examID
      in: path
      required: true
      schema: { type: integer, format: int64 }
    AttemptID:
      name: attemptID
      in: path
      required: true
      schema: { type: integer, format: int64 }
    CourseID:
      name: courseID
      in: path
      required: true
      schema: { type: integer, format: int64 }
    CategoryID:
      name: categoryID
      in: path
      required: true
      schema: { type: integer, format: int64 }
    AssetID:
      name: assetID
      in: path
      required: true
      schema: { type: integer, format: int64 }
    TaskID:
      name: taskID
      in: path
      required: true
      schema: { type: integer, format: int64 }

  schemas:
    Error:
      type: object
      required: [error]
      properties:
        error: { type: string }

    Mode:
      type: string
      enum: [training, exam]

    Credentials:
      type: object
      required: [username, password]
      properties:
        username: { type: string }
        password: { type: string }

    User:
      type: object
      required: [id, username, role]
      properties:
        id: { type: integer, format: int64 }
        username: { type: string }
        role: { type: string, enum: [user, admin] }

    AuthResponse:
      type: object
      required: [token, user]
      properties:
        token: { type: string }
        user: { $ref: '#/components/schemas/User' }

    Task:
      description: >
        Answer fields (correctIndex, explanations) are only present when the caller is allowed to see them:
        admin views, training-mode feedback, and finished attempts.
      type: object
      required: [id, prompt, options, audioAssetId, audioAutoplay]
      properties:
        id: { type: integer, format: int64 }
        audioAssetId: { type: integer, format: int64, nullable: true, description: 'The audio asset played with the task (GET /assets/{assetID}/file).' }
        audioAutoplay: { type: boolean, description: Start the audio by itself when the task appears. }
        prompt: { type: string, description: Russian text of the question. }
        passage: { type: string, description: Optional Russian text to read. }
        options:
          type: array
          items: { type: string }
        correctIndex: { type: integer }
        explanation: { type: string }

    Preferences:
      description: The user's own settings; they follow the account to any device.
      type: object
      required: [audioVolume, audioSpeed]
      properties:
        audioVolume: { type: number, format: double, minimum: 0, maximum: 1 }
        audioSpeed: { type: number, format: double, minimum: 0.25, maximum: 4, description: Playback rate of task audio; 1 is normal. }

    Asset:
      description: A stored file (audio or image) that tasks can use.
      type: object
      required: [id, type, name, externalId, mime, size, usedCount, createdAt]
      properties:
        id: { type: integer, format: int64 }
        type: { $ref: '#/components/schemas/AssetType' }
        name: { type: string }
        externalId: { type: string, nullable: true, description: The asset's ID in another system; unique when set. }
        mime: { type: string }
        size: { type: integer, description: Bytes. }
        usedCount: { type: integer, description: How many tasks use it. }
        createdAt: { type: string, format: date-time }

    AssetType:
      type: string
      enum: [audio, image]

    AssetForm:
      description: Multipart form. The file is required when creating; on update omit it to keep the current file.
      type: object
      required: [name]
      properties:
        type: { $ref: '#/components/schemas/AssetType' }
        name: { type: string }
        externalId: { type: string }
        file: { type: string, format: binary, description: An mp3 for audio; png, jpeg, gif or webp for image. At most 5 MB. }

    Course:
      type: object
      required: [id, titleRu, titleEn, flag, examsCount, tasksCount]
      properties:
        id: { type: integer, format: int64 }
        titleRu: { type: string }
        titleEn: { type: string }
        flag: { type: string, description: An emoji shown in the header course switcher, usually a flag. }
        examsCount: { type: integer }
        tasksCount: { type: integer }

    Category:
      type: object
      required: [id, courseId, titleRu, titleEn, examsCount]
      properties:
        id: { type: integer, format: int64 }
        courseId: { type: integer, format: int64 }
        titleRu: { type: string }
        titleEn: { type: string }
        examsCount: { type: integer }

    CategoryInput:
      type: object
      properties:
        courseId:
          type: integer
          format: int64
          description: Required when creating a category; ignored on update (a category never changes course).
        titleRu: { type: string }
        titleEn: { type: string }

    CourseInput:
      type: object
      required: [flag]
      properties:
        titleRu: { type: string }
        titleEn: { type: string }
        flag: { type: string, maxLength: 16 }

    TaskInput:
      type: object
      required: [prompt, options, correctIndex]
      properties:
        courseId:
          type: integer
          format: int64
          description: Required when creating a task; ignored on update (a task never changes course).
        audioAssetId: { type: integer, format: int64, nullable: true, description: An audio asset; null = no audio. }
        audioAutoplay: { type: boolean, description: Defaults to true when omitted. }
        prompt: { type: string }
        passage: { type: string }
        options:
          type: array
          minItems: 2
          maxItems: 8
          items: { type: string }
        correctIndex: { type: integer, minimum: 0 }
        explanation: { type: string }

    ExamRef:
      type: object
      required: [id, titleRu, titleEn]
      properties:
        id: { type: integer, format: int64 }
        titleRu: { type: string }
        titleEn: { type: string }

    AdminTask:
      description: A task together with the exams it is linked to. Tasks live in a bank and can be used by any number of exams.
      allOf:
        - $ref: '#/components/schemas/Task'
        - type: object
          required: [courseId, usedIn]
          properties:
            courseId: { type: integer, format: int64 }
            usedIn:
              type: array
              items: { $ref: '#/components/schemas/ExamRef' }

    AdminUser:
      type: object
      required: [id, username, role, blocked, createdAt, completedAttempts]
      properties:
        id: { type: integer, format: int64 }
        username: { type: string }
        role: { type: string, enum: [user, admin] }
        blocked: { type: boolean }
        createdAt: { type: string, format: date-time }
        completedAttempts: { type: integer }

    Settings:
      type: object
      required: [allowSignups]
      properties:
        allowSignups: { type: boolean }

    ExamInput:
      type: object
      properties:
        courseId:
          type: integer
          format: int64
          description: Required when creating an exam; ignored on update (an exam never changes course).
        categoryId:
          type: integer
          format: int64
          nullable: true
          description: The exam's category, which must belong to the exam's course; null = uncategorized.
        preserveOrder: { type: boolean, description: Sessions keep the task order instead of shuffling it. }
        titleRu: { type: string }
        titleEn: { type: string }
        descriptionRu: { type: string }
        descriptionEn: { type: string }

    ExamStats:
      type: object
      required: [attemptsCount, avgScore]
      properties:
        attemptsCount: { type: integer }
        avgScore: { type: number, format: double, nullable: true, description: Average score percent over all completed attempts. }

    MyExamStats:
      type: object
      required: [attemptsCount, bestScore, lastScore]
      properties:
        attemptsCount: { type: integer }
        bestScore: { type: number, format: double, nullable: true }
        lastScore: { type: number, format: double, nullable: true }

    ExamStatus:
      type: string
      enum: [pending, approved]
      description: New exams are pending until an admin approves them; learners only see approved exams.

    Exam:
      type: object
      required: [id, courseId, categoryId, status, preserveOrder, titleRu, titleEn, descriptionRu, descriptionEn, tasksCount, stats]
      properties:
        id: { type: integer, format: int64 }
        courseId: { type: integer, format: int64 }
        categoryId: { type: integer, format: int64, nullable: true }
        status: { $ref: '#/components/schemas/ExamStatus' }
        preserveOrder: { type: boolean }
        titleRu: { type: string }
        titleEn: { type: string }
        descriptionRu: { type: string }
        descriptionEn: { type: string }
        tasksCount: { type: integer }
        stats: { $ref: '#/components/schemas/ExamStats' }
        myStats: { $ref: '#/components/schemas/MyExamStats' }

    Attempt:
      type: object
      required: [id, examId, examTitleRu, examTitleEn, mode, status, startedAt, preserveOrder]
      properties:
        id: { type: integer, format: int64 }
        examId: { type: integer, format: int64 }
        examTitleRu: { type: string }
        examTitleEn: { type: string }
        mode: { $ref: '#/components/schemas/Mode' }
        status: { type: string, enum: [in_progress, completed] }
        startedAt: { type: string, format: date-time }
        finishedAt: { type: string, format: date-time, nullable: true }
        durationSeconds: { type: integer, nullable: true }
        correctCount: { type: integer, nullable: true }
        totalCount: { type: integer, nullable: true }
        scorePercent: { type: number, format: double, nullable: true }
        preserveOrder: { type: boolean, description: "The exam's setting: the session must not shuffle its tasks." }

    Streak:
      type: object
      required: [current, longest, doneToday]
      properties:
        current: { type: integer, description: Days in a row up to today, or up to yesterday while today has no lesson yet. }
        longest: { type: integer }
        doneToday: { type: boolean }

    AnswerState:
      type: object
      required: [taskId, selectedIndex]
      properties:
        taskId: { type: integer, format: int64 }
        selectedIndex: { type: integer }
        isCorrect: { type: boolean }
        correctIndex: { type: integer }
        explanation: { type: string }

    AttemptState:
      type: object
      required: [attempt, tasks, answers]
      properties:
        attempt: { $ref: '#/components/schemas/Attempt' }
        tasks:
          type: array
          items: { $ref: '#/components/schemas/Task' }
        answers:
          type: array
          items: { $ref: '#/components/schemas/AnswerState' }

    ResultItem:
      type: object
      required: [task, selectedIndex, isCorrect]
      properties:
        task: { $ref: '#/components/schemas/Task' }
        selectedIndex: { type: integer, nullable: true }
        isCorrect: { type: boolean }

    Result:
      type: object
      required: [attempt, items]
      properties:
        attempt: { $ref: '#/components/schemas/Attempt' }
        items:
          type: array
          items: { $ref: '#/components/schemas/ResultItem' }

paths:
  /auth/register:
    post:
      operationId: register
      description: Responds 403 when an admin has closed sign-ups (see /settings).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/Credentials' }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuthResponse' }
        default: { $ref: '#/components/responses/Error' }

  /auth/login:
    post:
      operationId: login
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/Credentials' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuthResponse' }
        default: { $ref: '#/components/responses/Error' }

  /me/preferences:
    get:
      operationId: getPreferences
      security: [{ bearer: [] }]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Preferences' }
        default: { $ref: '#/components/responses/Error' }
    put:
      operationId: updatePreferences
      security: [{ bearer: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/Preferences' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Preferences' }
        default: { $ref: '#/components/responses/Error' }

  /assets/{assetID}/file:
    parameters:
      - $ref: '#/components/parameters/AssetID'
    get:
      operationId: getAssetFile
      description: The asset's bytes. Supports range requests.
      security: [{ bearer: [] }]
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema: { type: string, format: binary }
        default: { $ref: '#/components/responses/Error' }

  /me:
    get:
      operationId: getMe
      security: [{ bearer: [] }]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/User' }
        default: { $ref: '#/components/responses/Error' }

  /me/attempts:
    get:
      operationId: listMyAttempts
      security: [{ bearer: [] }]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Attempt' }
        default: { $ref: '#/components/responses/Error' }

  /me/streak:
    get:
      operationId: getMyStreak
      description: Consecutive days with at least one finished lesson (a completed attempt, in any mode).
      security: [{ bearer: [] }]
      parameters:
        - name: tz
          in: query
          required: false
          description: IANA time zone of the learner (for example Europe/Moscow); a day is a calendar day in this zone. Defaults to UTC.
          schema: { type: string }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Streak' }
        default: { $ref: '#/components/responses/Error' }

  /courses:
    get:
      operationId: listCourses
      description: Public. Every course with how many exams and tasks it holds.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Course' }
        default: { $ref: '#/components/responses/Error' }

  /exams:
    get:
      operationId: listExams
      description: Public. When a bearer token is sent, each exam also carries the caller's personal stats.
      parameters:
        - name: courseId
          in: query
          description: Only the exams of this course.
          schema: { type: integer, format: int64 }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Exam' }
        default: { $ref: '#/components/responses/Error' }

  /exams/{examID}:
    parameters:
      - $ref: '#/components/parameters/ExamID'
    get:
      operationId: getExam
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Exam' }
        default: { $ref: '#/components/responses/Error' }

  /exams/{examID}/attempts:
    parameters:
      - $ref: '#/components/parameters/ExamID'
    post:
      operationId: startAttempt
      security: [{ bearer: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [mode]
              properties:
                mode: { $ref: '#/components/schemas/Mode' }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Attempt' }
        default: { $ref: '#/components/responses/Error' }

  /attempts/{attemptID}:
    parameters:
      - $ref: '#/components/parameters/AttemptID'
    get:
      operationId: getAttempt
      security: [{ bearer: [] }]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AttemptState' }
        default: { $ref: '#/components/responses/Error' }

  /attempts/{attemptID}/answers/{taskID}:
    parameters:
      - $ref: '#/components/parameters/AttemptID'
      - $ref: '#/components/parameters/TaskID'
    put:
      operationId: saveAnswer
      description: >
        In exam mode the answer can be changed until the attempt is finished. In training mode the answer is final
        and the response carries the correct answer and explanation.
      security: [{ bearer: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [selectedIndex]
              properties:
                selectedIndex: { type: integer, minimum: 0 }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AnswerState' }
        default: { $ref: '#/components/responses/Error' }

  /attempts/{attemptID}/finish:
    parameters:
      - $ref: '#/components/parameters/AttemptID'
    post:
      operationId: finishAttempt
      security: [{ bearer: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [durationSeconds]
              properties:
                durationSeconds: { type: integer, minimum: 0 }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Result' }
        default: { $ref: '#/components/responses/Error' }

  /attempts/{attemptID}/result:
    parameters:
      - $ref: '#/components/parameters/AttemptID'
    get:
      operationId: getResult
      security: [{ bearer: [] }]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Result' }
        default: { $ref: '#/components/responses/Error' }

  /categories:
    get:
      operationId: listCategories
      parameters:
        - { name: courseId, in: query, required: false, schema: { type: integer, format: int64 } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Category' }
        default: { $ref: '#/components/responses/Error' }

  /admin/categories:
    post:
      operationId: adminCreateCategory
      security: [{ bearer: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CategoryInput' }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Category' }
        default: { $ref: '#/components/responses/Error' }

  /admin/categories/{categoryID}:
    parameters:
      - $ref: '#/components/parameters/CategoryID'
    put:
      operationId: adminUpdateCategory
      security: [{ bearer: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CategoryInput' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Category' }
        default: { $ref: '#/components/responses/Error' }
    delete:
      operationId: adminDeleteCategory
      description: Fails with 409 while the category still has exams.
      security: [{ bearer: [] }]
      responses:
        '204': { description: Deleted }
        default: { $ref: '#/components/responses/Error' }

  /admin/courses:
    post:
      operationId: adminCreateCourse
      security: [{ bearer: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CourseInput' }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Course' }
        default: { $ref: '#/components/responses/Error' }

  /admin/courses/{courseID}:
    parameters:
      - $ref: '#/components/parameters/CourseID'
    put:
      operationId: adminUpdateCourse
      security: [{ bearer: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CourseInput' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Course' }
        default: { $ref: '#/components/responses/Error' }
    delete:
      operationId: adminDeleteCourse
      description: Fails with 409 while the course still has exams or tasks.
      security: [{ bearer: [] }]
      responses:
        '204': { description: Deleted }
        default: { $ref: '#/components/responses/Error' }

  /admin/exams:
    post:
      operationId: adminCreateExam
      security: [{ bearer: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ExamInput' }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Exam' }
        default: { $ref: '#/components/responses/Error' }

  /admin/exams/{examID}:
    parameters:
      - $ref: '#/components/parameters/ExamID'
    put:
      operationId: adminUpdateExam
      security: [{ bearer: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ExamInput' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Exam' }
        default: { $ref: '#/components/responses/Error' }
    delete:
      operationId: adminDeleteExam
      security: [{ bearer: [] }]
      responses:
        '204': { description: Deleted }
        default: { $ref: '#/components/responses/Error' }

  /admin/exams/{examID}/status:
    parameters:
      - $ref: '#/components/parameters/ExamID'
    put:
      operationId: adminSetExamStatus
      description: Approves an exam (making it available to learners) or sends it back to pending.
      security: [{ bearer: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                status: { $ref: '#/components/schemas/ExamStatus' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Exam' }
        default: { $ref: '#/components/responses/Error' }

  /admin/exams/{examID}/tasks:
    parameters:
      - $ref: '#/components/parameters/ExamID'
    get:
      operationId: adminListExamTasks
      description: The exam's tasks in order, including answers.
      security: [{ bearer: [] }]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/AdminTask' }
        default: { $ref: '#/components/responses/Error' }
    put:
      operationId: adminSetExamTasks
      description: >
        Replaces the exam's task list. The order of taskIds is the order inside the exam, so this one call links,
        unlinks and reorders. Every task must belong to the exam's course. The tasks themselves are not changed or deleted.
      security: [{ bearer: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [taskIds]
              properties:
                taskIds:
                  type: array
                  items: { type: integer, format: int64 }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/AdminTask' }
        default: { $ref: '#/components/responses/Error' }

  /admin/tasks:
    get:
      operationId: adminListTasks
      description: The task bank, newest first.
      security: [{ bearer: [] }]
      parameters:
        - name: courseId
          in: query
          description: Only the tasks of this course.
          schema: { type: integer, format: int64 }
        - name: unassigned
          in: query
          description: When true, only tasks that are not in any exam.
          schema: { type: boolean }
        - name: q
          in: query
          description: Case-insensitive search in the question text.
          schema: { type: string }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/AdminTask' }
        default: { $ref: '#/components/responses/Error' }
    post:
      operationId: adminCreateTask
      description: Creates a task in the bank. Link it to exams with PUT /admin/exams/{examID}/tasks.
      security: [{ bearer: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TaskInput' }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdminTask' }
        default: { $ref: '#/components/responses/Error' }

  /admin/tasks/import:
    post:
      operationId: adminImportTasks
      description: >
        Creates many tasks at once, all or nothing: if any task is invalid, nothing is created and the error names
        the offending tasks. The tasks are created in the course given by courseId. When examId is given the new
        tasks are also appended to that exam, which must belong to the same course.
      security: [{ bearer: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [courseId, tasks]
              properties:
                courseId: { type: integer, format: int64 }
                tasks:
                  type: array
                  minItems: 1
                  maxItems: 500
                  items: { $ref: '#/components/schemas/TaskInput' }
                examId: { type: integer, format: int64 }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                type: object
                required: [created]
                properties:
                  created: { type: integer }
        default: { $ref: '#/components/responses/Error' }

  /admin/tasks/bulk:
    post:
      operationId: adminBulkTasks
      description: >
        Applies one action to several bank tasks at once. delete removes them from the bank and every exam;
        unlink removes them from every exam (they stay in the bank); link appends them to the exam given by examId,
        skipping those already in it. The exam and all tasks must belong to the same course.
      security: [{ bearer: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [action, taskIds]
              properties:
                action: { type: string, enum: [delete, unlink, link] }
                taskIds:
                  type: array
                  items: { type: integer, format: int64 }
                examId:
                  type: integer
                  format: int64
                  description: Required for link.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [affected]
                properties:
                  affected: { type: integer, description: Number of tasks actually changed. }
        default: { $ref: '#/components/responses/Error' }

  /admin/assets:
    get:
      operationId: adminListAssets
      security: [{ bearer: [] }]
      parameters:
        - name: type
          in: query
          schema: { $ref: '#/components/schemas/AssetType' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Asset' }
        default: { $ref: '#/components/responses/Error' }
    post:
      operationId: adminCreateAsset
      security: [{ bearer: [] }]
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema: { $ref: '#/components/schemas/AssetForm' }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Asset' }
        default: { $ref: '#/components/responses/Error' }

  /admin/assets/{assetID}:
    parameters:
      - $ref: '#/components/parameters/AssetID'
    put:
      operationId: adminUpdateAsset
      security: [{ bearer: [] }]
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema: { $ref: '#/components/schemas/AssetForm' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Asset' }
        default: { $ref: '#/components/responses/Error' }
    delete:
      operationId: adminDeleteAsset
      description: Fails with 409 while tasks still use the asset.
      security: [{ bearer: [] }]
      responses:
        '204': { description: Deleted }
        default: { $ref: '#/components/responses/Error' }

  /admin/tasks/{taskID}:
    parameters:
      - $ref: '#/components/parameters/TaskID'
    put:
      operationId: adminUpdateTask
      description: Edits the task everywhere it is used.
      security: [{ bearer: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TaskInput' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdminTask' }
        default: { $ref: '#/components/responses/Error' }
    delete:
      operationId: adminDeleteTask
      description: Deletes the task from the bank and from every exam that uses it.
      security: [{ bearer: [] }]
      responses:
        '204': { description: Deleted }
        default: { $ref: '#/components/responses/Error' }

  /settings:
    get:
      operationId: getSettings
      description: Public app settings.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Settings' }
        default: { $ref: '#/components/responses/Error' }

  /admin/settings:
    put:
      operationId: adminUpdateSettings
      security: [{ bearer: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/Settings' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Settings' }
        default: { $ref: '#/components/responses/Error' }

  /admin/users:
    get:
      operationId: adminListUsers
      security: [{ bearer: [] }]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/AdminUser' }
        default: { $ref: '#/components/responses/Error' }

  /admin/users/{userID}/blocked:
    parameters:
      - name: userID
        in: path
        required: true
        schema: { type: integer, format: int64 }
    put:
      operationId: adminSetUserBlocked
      description: Blocks or unblocks a learner. Blocking ends their sessions immediately. Admin accounts cannot be blocked.
      security: [{ bearer: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [blocked]
              properties:
                blocked: { type: boolean }
      responses:
        '204': { description: Updated }
        default: { $ref: '#/components/responses/Error' }

  /admin/users/{userID}/reset-password:
    parameters:
      - name: userID
        in: path
        required: true
        schema: { type: integer, format: int64 }
    post:
      operationId: adminResetUserPassword
      description: Sets a random temporary password and signs the user out everywhere. The password is returned once.
      security: [{ bearer: [] }]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [temporaryPassword]
                properties:
                  temporaryPassword: { type: string }
        default: { $ref: '#/components/responses/Error' }
